# 起步模板：装箱单（Packing List）。
# 字段按外贸单证里装箱单的通用要素设计：出口商 / 进口商、发票号、合同号、唛头、起运港和目的港，
# 每一行的箱号、品名、件数、数量、净重、毛重、体积，以及合计；和商业发票、提单上的件数、重量要对得上。
# 只写字段和通用要求，不放任何真实单据的内容。

name = "packing_list"
version = 2
title = "装箱单（Packing List）"
titles = { en = "Packing List", ar = "قائمة التعبئة", de = "Packliste", es = "Lista de empaque", fr = "Liste de colisage", hi = "पैकिंग सूची", id = "Daftar kemasan", it = "Lista di imballaggio", ja = "パッキングリスト", ko = "포장명세서", ms = "Senarai pembungkusan", nl = "Paklijst", pl = "Lista pakowa", th = "รายการบรรจุหีบห่อ", vi = "Phiếu đóng gói", "zh-Hant" = "裝箱單" }
domains = ["物流", "外贸单证"]
description = "出口、进口货物的装箱单：发货人、收货人、发票号、合同号、唛头、港口，每一行的箱号、品名、件数、数量、净重、毛重、体积和合计。每行件数、数量、重量、体积加起来和合计对不上、净重比毛重大会提醒。"
rules = [
  "packing_packages",
  "packing_quantity",
  "packing_net",
  "packing_gross",
  "packing_volume",
  "net_not_over_gross",
  "total_net_not_over_gross",
]

[[fields]]
name = "document_no"
label = "装箱单号"
names = { en = "Packing List No.", ar = "رقم قائمة التعبئة", de = "Packlistennummer", es = "N.º de lista de empaque", fr = "N° de liste de colisage", hi = "पैकिंग सूची संख्या", id = "Nomor packing list", it = "N. lista di imballaggio", ja = "パッキングリスト番号", ko = "포장명세서 번호", ms = "No. senarai pembungkusan", nl = "Paklijstnummer", pl = "Numer listy pakowej", th = "เลขที่รายการบรรจุ", vi = "Số phiếu đóng gói", "zh-Hant" = "裝箱單號" }
type = "string"
unique = true
description = "装箱单自己的编号，照抄；没有单独编号的留空"
aliases = ["装箱单号", "Packing List No", "P/L No", "PL No", "No."]

[[fields]]
name = "issue_date"
label = "日期"
