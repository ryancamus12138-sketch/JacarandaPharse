# 起步模板：装箱单（Packing List）。
# 字段按外贸单证里装箱单的通用要素设计：出口商 / 进口商、发票号、合同号、唛头、起运港和目的港，
# 每一行的箱号、品名、件数、数量、净重、毛重、体积，以及合计；和商业发票、提单上的件数、重量要对得上。
# 只写字段和通用要求，不放任何真实单据的内容。

name = "packing_list"
version = 2
title = "装箱单（Packing List）"
titles = { en = "Packing List" }
domains = ["物流", "外贸单证"]
description = "出口、进口货物的装箱单：发货人、收货人、发票号、合同号、唛头、港口，每一行的箱号、品名、件数、数量、净重、毛重、体积和合计。每行件数、数量、重量、体积加起来和合计对不上、净重比毛重大会提醒。"
rules = [
  "packing_packages",
  "packing_quantity",
  "packing_net",
  "packing_gross",
  "packing_volume",
  "net_not_over_gross",
  "total_net_not_over_gross",
]

[[fields]]
name = "document_no"
label = "装箱单号"
names = { en = "Packing List No." }
type = "string"
unique = true
description = "装箱单自己的编号，照抄；没有单独编号的留空"
aliases = ["装箱单号", "Packing List No", "P/L No", "PL No", "No."]

[[fields]]
name = "issue_date"
label = "日期"
names = { en = "Date" }
type = "date"
aliases = ["日期", "Date", "Issue Date"]

[[fields]]
name = "invoice_no"
label = "发票号"
names = { en = "Invoice No." }
type = "string"
description = "对应的商业发票号，照抄"
aliases = ["发票号码", "Invoice No", "Invoice Number", "Inv. No"]

[[fields]]
name = "contract_no"
label = "合同号"
names = { en = "Contract No." }
type = "string"
description = "合同号、订单号（S/C、P/O），照抄"
aliases = ["合同号码", "订单号", "Contract No", "S/C No", "P/O No", "Order No"]

[[fields]]
name = "shipper"
label = "发货人"
names = { en = "Shipper" }
type = "string"
required = true
description = "出口商、卖方的名称（地址不用写）"
aliases = ["出口商", "卖方", "Shipper", "Exporter", "Seller", "From"]

[[fields]]
name = "consignee"
label = "收货人"
names = { en = "Consignee" }
type = "string"
description = "进口商、买方、收货人的名称（地址不用写）"
aliases = ["进口商", "买方", "Consignee", "Importer", "Buyer", "To", "Messrs"]

[[fields]]
name = "port_of_loading"
label = "起运港"
names = { en = "Port of Loading" }
type = "string"
aliases = ["装运港", "Port of Loading", "From", "POL"]

[[fields]]
name = "port_of_destination"
label = "目的港"
names = { en = "Port of Destination" }
type = "string"
aliases = ["卸货港", "Port of Destination", "Port of Discharge", "To", "POD"]

[[fields]]
name = "transport"
label = "运输方式"
names = { en = "Mode of Transport" }
type = "string"
description = "船名航次、航班号或运输方式（By Sea、By Air），照抄"
aliases = ["运输工具", "船名", "Shipped per", "Vessel", "By"]

[[fields]]
name = "shipping_marks"
label = "唛头"
names = { en = "Shipping Marks" }
type = "string"
description = "Shipping Marks 一栏照抄，多行用空格连起来；写 N/M 的照抄 N/M"
aliases = ["唛头", "Shipping Marks", "Marks", "Marks & Nos"]

[[fields]]
name = "total_packages"
label = "总件数"
names = { en = "Total Packages" }
type = "number"
description = "一共多少件（箱、托、包），只要数字"
aliases = ["总件数", "总箱数", "Total Packages", "Total Cartons", "Total CTNS", "Total"]

[[fields]]
name = "package_unit"
label = "包装单位"
names = { en = "Package Unit" }
type = "string"
description = "件数的单位，照抄：CTNS、PALLETS、BAGS、箱"
aliases = ["包装", "Package", "Packing"]

[[fields]]
name = "total_quantity"
label = "总数量"
names = { en = "Total Quantity" }
type = "number"
description = "货物的总数量（个、套、米……），只要数字"
aliases = ["总数量", "Total Quantity", "Total Qty"]

[[fields]]
name = "total_net_weight"
label = "总净重"
names = { en = "Total Net Weight" }
type = "number"
description = "只要数字，单位写在「重量单位」里"
aliases = ["总净重", "Total N.W.", "Total Net Weight", "N.W."]

[[fields]]
name = "total_gross_weight"
label = "总毛重"
names = { en = "Total Gross Weight" }
type = "number"
aliases = ["总毛重", "Total G.W.", "Total Gross Weight", "G.W."]

[[fields]]
name = "weight_unit"
label = "重量单位"
names = { en = "Weight Unit" }
type = "string"
options = ["KG", "KGS", "LBS", "千克", "公斤"]
aliases = ["Unit"]

[[fields]]
name = "total_volume"
label = "总体积"
names = { en = "Total Volume" }
type = "number"
description = "总体积，一般是立方米（CBM），只要数字"
aliases = ["总体积", "Total Measurement", "Total Volume", "Total CBM", "MEAS"]

[[tables]]
name = "packages"
label = "装箱明细"
names = { en = "Packing Details" }
required = true
description = "每一行一种货物或一组箱子（箱号 1-10 这种算一行）。表头、合计行不算一行"

[[tables.columns]]
name = "carton_no"
label = "箱号"
names = { en = "Carton No." }
type = "string"
description = "箱号范围，照抄，如 1-10、C/No. 11-20"
aliases = ["箱号", "C/No.", "Carton No", "Case No"]

[[tables.columns]]
name = "description"
label = "品名"
names = { en = "Description" }
type = "string"
description = "货物名称和规格，照抄"
aliases = ["货物名称", "品名", "Description", "Description of Goods", "Commodity"]

[[tables.columns]]
name = "model"
label = "型号"
names = { en = "Model" }
type = "string"
aliases = ["规格", "型号", "货号", "Item No", "Model", "Art No"]

[[tables.columns]]
name = "cartons"
label = "件数"
names = { en = "Cartons" }
type = "number"
description = "这一行有几箱（几件），只要数字"
aliases = ["件数", "箱数", "CTNS", "Packages", "Cartons"]

[[tables.columns]]
name = "quantity"
label = "数量"
names = { en = "Quantity" }
type = "number"
description = "这一行货物的数量（不是箱数），只要数字"
aliases = ["数量", "Quantity", "Qty", "PCS"]

[[tables.columns]]
name = "unit"
label = "单位"
names = { en = "Unit" }
type = "string"
aliases = ["单位", "Unit"]

[[tables.columns]]
name = "net_weight"
label = "净重"
names = { en = "Net Weight" }
type = "number"
description = "这一行的净重合计。单据只写了每箱净重的，照抄每箱净重，审核时再看"
aliases = ["净重", "N.W.", "Net Weight"]

[[tables.columns]]
name = "gross_weight"
label = "毛重"
names = { en = "Gross Weight" }
type = "number"
description = "这一行的毛重合计（同上）"
aliases = ["毛重", "G.W.", "Gross Weight"]

[[tables.columns]]
name = "volume"
label = "体积"
names = { en = "Volume" }
type = "number"
description = "这一行的体积（立方米）"
aliases = ["体积", "Measurement", "MEAS", "CBM", "Volume"]
