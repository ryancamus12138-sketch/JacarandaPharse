# 起步模板：España factura completa / factura simplificada。
# 依据：Real Decreto 1619/2012（Reglamento de facturación）art. 6：número y serie、fecha、nombre y NIF de emisor y destinatario、
#   domicilio、descripción、base imponible、tipo impositivo、cuota、fecha de la operación si distinta；art. 4 y 7：factura simplificada
#   hasta 400 € (o 3.000 € en comercio minorista, hostelería, transporte de personas y demás sectores del art. 4.1)。
#   IVA 21 / 10 / 4 %（Ley 37/1992 art. 90–91）。NIF：DNI、NIE、CIF 各有校验。
# 场景：西班牙企业开票、IVA soportado 抵扣、报销。
# 来源：invoicedataextraction「Spain VAT invoice requirements」；BOE A-2012-14696。
# 只写字段和法规要求，不放任何真实单据的内容。

name = "es_factura"
version = 1
title = "西班牙发票（Factura）"
titles = { en = "Invoice (Spain)", es = "Factura" }
countries = ["ES"]
domains = ["发票"]
description = "西班牙的 factura：系列和编号、日期、开票方和收票方的名称 NIF 地址、描述、各税率的计税基础、税率和税额、总额。NIF 校验不对、税率不是 21/10/4%、factura simplificada 超过 400 € 会提醒。"
descriptions = { en = "Spanish invoices (factura): series and number, date, names, NIFs and addresses of the issuer and recipient, description, tax base per rate, rate and tax, total. Invalid NIF checks, rates other than 21/10/4%, and factura simplificada above 400 € are reported." }
rules = ["issue_date_exists", "issue_date_not_future", "net_tax_gross", "item_line", "es_seller_nif", "es_buyer_nif", "es_rates", "es_simplificada"]

[basis]
# English version of the notes at the top of this file.
en = [
  "For: Spanish full invoices / simplified invoices (factura completa / factura simplificada).",
  "Basis: Royal Decree 1619/2012 (Invoicing Regulation) art. 6: number and series, date, name and NIF of the issuer and recipient, address, description, tax base, tax rate, tax amount, date of the transaction if different; art. 4 and 7: simplified invoices up to 400 € (or 3,000 € in retail, hospitality, passenger transport and the other sectors of art. 4.1). VAT 21 / 10 / 4 % (Law 37/1992 art. 90–91). NIF: DNI, NIE and CIF each have their own check.",
  "Use: invoicing by Spanish businesses, deduction of input VAT (IVA soportado), expense claims.",
  "Sources: invoicedataextraction \"Spain VAT invoice requirements\"; BOE A-2012-14696.",
]

[[fields]]
name = "document_title"
label = "单据标题"
names = { en = "Document Title", es = "Tipo de factura" }
type = "string"
description = "单据最上面的标题，照抄"
descriptions = { en = "The title at the top of the document; copy it as written" }
aliases = ["Tipo de factura"]

[[fields]]
name = "serie"
label = "系列"
names = { en = "Series", es = "Serie" }
type = "string"
aliases = ["Serie"]

[[fields]]
name = "invoice_no"
label = "发票号码"
names = { en = "Invoice No.", es = "Número de factura" }
type = "string"
required = true
unique = true
description = "照抄，不要改格式"
descriptions = { en = "Copy it as written; do not change the format" }
aliases = ["Número de factura"]

[[fields]]
name = "issue_date"
label = "开具日期"
names = { en = "Date of Issue", es = "Fecha de expedición" }
type = "date"
required = true
aliases = ["Fecha de expedición"]

[[fields]]
name = "supply_date"
label = "交易日期"
names = { en = "Date of Supply", es = "Fecha de operación" }
type = "date"
description = "供货或提供服务的日期；和开具日期一样、或没写的留空"
descriptions = { en = "The date of supply of goods or services; leave empty if it equals the issue date or is not given" }
aliases = ["Fecha de operación"]

[[fields]]
name = "seller_name"
label = "卖方名称"
names = { en = "Seller", es = "Emisor" }
type = "string"
required = true
aliases = ["Emisor"]

[[fields]]
name = "seller_address"
label = "卖方地址"
names = { en = "Seller Address", es = "Domicilio del emisor" }
type = "string"
aliases = ["Domicilio del emisor"]

[[fields]]
name = "seller_tax_id"
label = "卖方税号"
names = { en = "Seller Tax ID", es = "NIF del emisor" }
type = "string"
description = "照抄，带上字母和分隔符"
descriptions = { en = "Copy it as written, with letters and separators" }
aliases = ["NIF del emisor"]

[[fields]]
name = "buyer_name"
label = "买方名称"
names = { en = "Buyer", es = "Destinatario" }
type = "string"
aliases = ["Destinatario"]

[[fields]]
name = "buyer_address"
label = "买方地址"
names = { en = "Buyer Address", es = "Domicilio del destinatario" }
type = "string"
aliases = ["Domicilio del destinatario"]

[[fields]]
name = "buyer_tax_id"
label = "买方税号"
names = { en = "Buyer Tax ID", es = "NIF del destinatario" }
type = "string"
description = "照抄；没有就留空"
descriptions = { en = "Copy it as written; leave empty if absent" }
aliases = ["NIF del destinatario"]

[[fields]]
name = "net_total"
label = "不含税合计"
names = { en = "Total excl. Tax", es = "Base imponible" }
type = "number"
aliases = ["Base imponible"]

[[fields]]
name = "tax_total"
label = "税额合计"
names = { en = "Total Tax", es = "Cuota de IVA" }
type = "number"
aliases = ["Cuota de IVA"]

[[fields]]
name = "gross_total"
label = "含税合计"
names = { en = "Total incl. Tax", es = "Total factura" }
type = "number"
required = true
aliases = ["Total factura"]

[[tables]]
name = "items"
label = "明细"
names = { en = "Items", es = "Conceptos" }
description = "每一行商品或服务一行；表头、小计、合计不算"
descriptions = { en = "One row per product or service; headers, subtotals and totals do not count" }

[[tables.columns]]
name = "description"
label = "品名"
names = { en = "Description", es = "Descripción" }
type = "string"
aliases = ["Descripción"]

[[tables.columns]]
name = "quantity"
label = "数量"
names = { en = "Quantity", es = "Cantidad" }
type = "number"
aliases = ["Cantidad"]

[[tables.columns]]
name = "unit_price"
label = "单价"
names = { en = "Unit Price", es = "Precio unitario" }
type = "number"
aliases = ["Precio unitario"]

[[tables.columns]]
name = "amount"
label = "金额"
names = { en = "Amount", es = "Importe" }
type = "number"
description = "这一行的金额（单据上怎么写就照抄：含税还是不含税看表头）"
descriptions = { en = "The amount of this row (copy as written; whether it includes tax depends on the header)" }
aliases = ["Importe"]

[[tables.columns]]
name = "tax_rate"
label = "税率"
names = { en = "Tax Rate", es = "Tipo de IVA" }
type = "string"
aliases = ["Tipo de IVA"]
