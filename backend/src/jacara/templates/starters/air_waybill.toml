# 起步模板：航空运单（Air Waybill，AWB）。
# 字段按 IATA 第 600a 号决议规定的航空运单格式的栏目设计：运单号（3 位航空公司代码 + 8 位序号）、
# 托运人、收货人、出票代理、始发站和目的站、航班、供运输和海关用的声明价值、件数、毛重、运价等级、
# 计费重量、费率、运费、其他费用、预付和到付合计、签发日期和地点。分运单（HAWB）也能用。
# 只写字段和通用要求，不放任何真实运单的内容。

name = "air_waybill"
version = 2
title = "航空运单（AWB）"
titles = { en = "Air Waybill (AWB)", ar = "بوليصة الشحن الجوي (AWB)", de = "Luftfrachtbrief (AWB)", es = "Guía aérea (AWB)", fr = "Lettre de transport aérien (LTA)", hi = "हवाई मार्ग बिल (AWB)", id = "Surat muatan udara (AWB)", it = "Lettera di vettura aerea (AWB)", ja = "航空運送状（AWB）", ko = "항공화물운송장(AWB)", ms = "Bil muatan udara (AWB)", nl = "Luchtvrachtbrief (AWB)", pl = "Lotniczy list przewozowy (AWB)", th = "ใบตราส่งสินค้าทางอากาศ (AWB)", vi = "Vận đơn hàng không (AWB)", "zh-Hant" = "航空提單（AWB）" }
domains = ["物流", "外贸单证"]
description = "航空货运的主运单、分运单：运单号、航空公司、托运人、收货人、代理、始发和目的机场、航班日期、声明价值、件数、毛重、计费重量，每一行运价（等级、费率、运费、品名），以及其他费用和预付、到付合计。运单号校验位不对、件数和重量加起来对不上、计费重量 × 费率和运费对不上会提醒。"
descriptions = { en = "Air cargo master and house waybills: waybill number, airline, shipper, consignee, agent, airports of departure and destination, flight and date, declared values, packages, gross weight, chargeable weight, each rate line (class, rate, charge, description), other charges and prepaid and collect totals. Invalid waybill check digits, packages or weights that do not add up, and chargeable weight × rate not matching the charge are reported." }
rules = ["awb_no", "awb_pieces", "awb_weight", "awb_rate_line"]

[basis]
# English version of the notes at the top of this file.
en = [
  "For: air waybills (AWB).",
  "Fields follow the boxes of the air waybill format defined by IATA Resolution 600a: waybill number (3-digit airline prefix + 8-digit serial), shipper, consignee, issuing agent, airports of departure and destination, flight, declared values for carriage and customs, packages, gross weight, rate class, chargeable weight, rate, charge, other charges, prepaid and collect totals, date and place of issue. House waybills (HAWB) work too.",
]

