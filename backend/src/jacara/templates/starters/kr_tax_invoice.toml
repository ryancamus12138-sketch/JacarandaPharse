# 起步模板：韩国 세금계산서 / 전자세금계산서。
# 依据：부가가치세법 제32조（필요적 기재사항：공급자 등록번호와 성명·명칭、공급받는자 등록번호、공급가액과 부가가치세액、작성 연월일）；
#   시행령 제67조（추가 기재사항：주소、업태·종목、품목、단가·수량、공급연월일）；제30조 세율 10%；
#   제39조：필요적 기재사항이 없거나 사실과 다르면 매입세액 불공제。사업자등록번호 10 자리 검증번호。
# 场景：韩国企业间交易开具，买方用来抵扣进项税；法人和一定规模以上的个人必须开电子税金计算书。
# 来源：watax.kr「세금계산서 필요적 기재사항」；사업자등록번호 검증 알고리즘。
# 只写字段和法规要求，不放任何真实单据的内容。

name = "kr_tax_invoice"
version = 1
title = "韩国税金计算书"
titles = { en = "Tax Invoice (Korea)", ko = "세금계산서" }
countries = ["KR"]
domains = ["发票"]
description = "韩国的세금계산서：公급자和公급받는자的登录号码（10 位）、商号、地址、作成日期、供应价额、附加税额、品目。登录号码校验位不对、附加税不等于供应价额 × 10% 会提醒。"
rules = ["issue_date_exists", "issue_date_not_future", "kr_seller_no", "kr_buyer_no", "kr_vat_10", "net_tax_gross", "item_line"]

[[fields]]
name = "document_title"
label = "单据标题"
names = { en = "Document Title", ko = "문서명" }
type = "string"
description = "单据最上面的标题，照抄"
aliases = ["문서명"]

[[fields]]
name = "approval_no"
label = "承认号码"
names = { en = "Approval No.", ko = "승인번호" }
type = "string"
unique = true
description = "电子税金计算书的 승인번호（24 位），照抄"
aliases = ["승인번호"]

[[fields]]
name = "invoice_no"
label = "发票号码"
names = { en = "Invoice No.", ko = "일련번호" }
type = "string"
description = "照抄，不要改格式"
aliases = ["일련번호"]

[[fields]]
name = "issue_date"
label = "开具日期"
names = { en = "Date of Issue", ko = "작성일자" }
type = "date"
required = true
aliases = ["작성일자"]

[[fields]]
name = "supply_date"
label = "交易日期"
names = { en = "Date of Supply", ko = "공급연월일" }
type = "date"
description = "供货或提供服务的日期；和开具日期一样、或没写的留空"
aliases = ["공급연월일"]

[[fields]]
name = "seller_tax_id"
label = "卖方税号"
names = { en = "Seller Tax ID", ko = "공급자 등록번호" }
type = "string"
required = true
description = "照抄，带上字母和分隔符"
aliases = ["공급자 등록번호"]

[[fields]]
name = "seller_name"
label = "卖方名称"
names = { en = "Seller", ko = "공급자 상호" }
type = "string"
required = true
aliases = ["공급자 상호"]

[[fields]]
name = "seller_rep"
label = "卖方代表人"
names = { en = "Representative", ko = "성명" }
type = "string"
aliases = ["성명"]

[[fields]]
name = "seller_address"
label = "卖方地址"
names = { en = "Seller Address", ko = "공급자 주소" }
type = "string"
aliases = ["공급자 주소"]

[[fields]]
name = "business_type"
label = "业态 / 种目"
names = { en = "Business Type / Item", ko = "업태·종목" }
type = "string"
aliases = ["업태·종목"]

[[fields]]
name = "buyer_tax_id"
label = "买方税号"
names = { en = "Buyer Tax ID", ko = "공급받는자 등록번호" }
type = "string"
required = true
description = "照抄；没有就留空"
aliases = ["공급받는자 등록번호"]

[[fields]]
name = "buyer_name"
label = "买方名称"
names = { en = "Buyer", ko = "공급받는자 상호" }
type = "string"
aliases = ["공급받는자 상호"]

[[fields]]
name = "buyer_address"
label = "买方地址"
names = { en = "Buyer Address", ko = "공급받는자 주소" }
type = "string"
aliases = ["공급받는자 주소"]

[[fields]]
name = "net_total"
label = "不含税合计"
names = { en = "Total excl. Tax", ko = "공급가액" }
type = "number"
required = true
aliases = ["공급가액"]

[[fields]]
name = "tax_total"
label = "税额合计"
names = { en = "Total Tax", ko = "세액" }
type = "number"
required = true
aliases = ["세액"]

[[fields]]
name = "gross_total"
label = "含税合计"
names = { en = "Total incl. Tax", ko = "합계금액" }
type = "number"
required = true
aliases = ["합계금액"]

[[tables]]
name = "items"
label = "明细"
names = { en = "Items", ko = "품목" }
description = "每一行商品或服务一行；表头、小计、合计不算"

[[tables.columns]]
name = "description"
label = "品名"
names = { en = "Description", ko = "품목" }
type = "string"
aliases = ["품목"]

[[tables.columns]]
name = "quantity"
label = "数量"
names = { en = "Quantity", ko = "수량" }
type = "number"
aliases = ["수량"]

[[tables.columns]]
name = "unit_price"
label = "单价"
names = { en = "Unit Price", ko = "단가" }
type = "number"
aliases = ["단가"]

[[tables.columns]]
name = "amount"
label = "金额"
names = { en = "Amount", ko = "공급가액" }
type = "number"
description = "这一行的金额（单据上怎么写就照抄：含税还是不含税看表头）"
aliases = ["공급가액"]

[[tables.columns]]
name = "tax"
label = "税额"
names = { en = "Tax", ko = "세액" }
type = "number"
aliases = ["세액"]
