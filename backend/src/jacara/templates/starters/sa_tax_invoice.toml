# 起步模板：Saudi Arabia tax invoice（B2B）/ simplified tax invoice（B2C，必须有二维码），ZATCA FATOORA 电子发票。
# 依据：VAT Implementing Regulations art. 53；E-Invoicing Regulation（ZATCA）：标准税票要有卖方和买方的名称地址 VAT 号、
#   顺序号、日期、供货日期、描述数量单价、应税额、税率和税额、含税总额；简易税票要有卖方名称和 VAT 号、日期、描述、
#   含税总额、VAT 金额和二维码。VAT 15%（2020-07 起）。须有阿拉伯文。
# 场景：沙特企业开具，买方抵扣进项；报销。
# 来源：invoicedataextraction「Saudi Arabia VAT invoice requirements」；ZATCA Simplified guide。
# 只写字段和法规要求，不放任何真实单据的内容。

name = "sa_tax_invoice"
version = 1
title = "沙特增值税电子发票"
titles = { en = "Tax Invoice (Saudi Arabia)", ar = "فاتورة ضريبية" }
countries = ["SA"]
domains = ["发票"]
description = "沙特的税务发票：卖方和买方的名称地址和 15 位 VAT 号、发票号、日期、供货日期、描述、数量、单价、应税额、税率、VAT、含税总额。VAT 号不是 15 位、VAT 不等于 15% 会提醒。"
rules = ["issue_date_exists", "issue_date_not_future", "net_tax_gross", "item_line", "sa_vat_no", "sa_vat_15"]

[[fields]]
name = "document_title"
label = "单据标题"
names = { en = "Document Title", ar = "عنوان المستند" }
type = "string"
description = "单据最上面的标题，照抄"
aliases = ["عنوان المستند"]

[[fields]]
name = "invoice_no"
label = "发票号码"
names = { en = "Invoice No.", ar = "رقم الفاتورة" }
type = "string"
required = true
unique = true
description = "照抄，不要改格式"
aliases = ["رقم الفاتورة"]

[[fields]]
name = "issue_date"
label = "开具日期"
names = { en = "Date of Issue", ar = "تاريخ الإصدار" }
type = "date"
required = true
aliases = ["تاريخ الإصدار"]

[[fields]]
name = "supply_date"
label = "交易日期"
names = { en = "Date of Supply", ar = "تاريخ التوريد" }
type = "date"
description = "供货或提供服务的日期；和开具日期一样、或没写的留空"
aliases = ["تاريخ التوريد"]

[[fields]]
name = "seller_name"
label = "卖方名称"
names = { en = "Seller", ar = "اسم المورد" }
type = "string"
required = true
aliases = ["اسم المورد"]

[[fields]]
name = "seller_address"
label = "卖方地址"
names = { en = "Seller Address", ar = "عنوان المورد" }
type = "string"
aliases = ["عنوان المورد"]

[[fields]]
name = "seller_tax_id"
label = "卖方 VAT 号"
names = { en = "Seller VAT No.", ar = "الرقم الضريبي للمورد" }
type = "string"
aliases = ["VAT No", "VAT Registration Number", "الرقم الضريبي للمورد"]

[[fields]]
name = "buyer_name"
label = "买方名称"
names = { en = "Buyer", ar = "اسم المشتري" }
type = "string"
aliases = ["اسم المشتري"]

[[fields]]
name = "buyer_address"
label = "买方地址"
names = { en = "Buyer Address", ar = "عنوان المشتري" }
type = "string"
aliases = ["عنوان المشتري"]

[[fields]]
name = "buyer_tax_id"
label = "买方 VAT 号"
names = { en = "Buyer VAT No.", ar = "الرقم الضريبي للمشتري" }
type = "string"
aliases = ["الرقم الضريبي للمشتري"]

[[fields]]
name = "net_total"
label = "不含税合计"
names = { en = "Total excl. Tax", ar = "الإجمالي غير شامل الضريبة" }
type = "number"
aliases = ["الإجمالي غير شامل الضريبة"]

[[fields]]
name = "tax_total"
label = "税额合计"
names = { en = "Total Tax", ar = "ضريبة القيمة المضافة" }
type = "number"
aliases = ["ضريبة القيمة المضافة"]

[[fields]]
name = "gross_total"
label = "含税合计"
names = { en = "Total incl. Tax", ar = "الإجمالي شامل الضريبة" }
type = "number"
required = true
aliases = ["الإجمالي شامل الضريبة"]

[[tables]]
name = "items"
label = "明细"
names = { en = "Items", ar = "البنود" }
description = "每一行商品或服务一行；表头、小计、合计不算"

[[tables.columns]]
name = "description"
label = "品名"
names = { en = "Description", ar = "الوصف" }
type = "string"
aliases = ["الوصف"]

[[tables.columns]]
name = "quantity"
label = "数量"
names = { en = "Quantity", ar = "الكمية" }
type = "number"
aliases = ["الكمية"]

[[tables.columns]]
name = "unit_price"
label = "单价"
names = { en = "Unit Price", ar = "سعر الوحدة" }
type = "number"
aliases = ["سعر الوحدة"]

[[tables.columns]]
name = "amount"
label = "金额"
names = { en = "Amount", ar = "المبلغ" }
type = "number"
description = "这一行的金额（单据上怎么写就照抄：含税还是不含税看表头）"
aliases = ["المبلغ"]

[[tables.columns]]
name = "tax_rate"
label = "税率"
names = { en = "Tax Rate", ar = "نسبة الضريبة" }
type = "string"
aliases = ["نسبة الضريبة"]
