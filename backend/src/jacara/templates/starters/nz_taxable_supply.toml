# 起步模板：New Zealand taxable supply information（2023-04-01 起取代 tax invoice）。
# 依据：Goods and Services Tax Act 1985 s19F–19N；IRD：$200 及以下只需供应商名称、日期、描述、金额；
#   $200–$1,000 加 GST 号和 GST 金额（或含 GST 声明）；超过 $1,000 加买方名称和一项识别信息（地址、电话、邮箱、NZBN 等）。GST 15%。
# 场景：GST 登记的企业凭此抵扣进项税；报销核对 GST。
# 来源：IRD「How taxable supply information for GST works」（ird.govt.nz）。
# 只写字段和法规要求，不放任何真实单据的内容。

name = "nz_taxable_supply"
version = 1
title = "新西兰 GST 应税供应信息（税务发票）"
titles = { en = "Taxable Supply Information (New Zealand)" }
countries = ["NZ"]
domains = ["发票"]
description = "新西兰的 taxable supply information：供应商名称和 GST 号、日期、描述、不含 GST 金额、GST、含 GST 金额，超过 $1,000 时的买方信息。GST 号校验位不对、GST 超过含税总额的 3/23、超过 $1,000 没有买方名称会提醒。"
rules = ["issue_date_exists", "issue_date_not_future", "net_tax_gross", "item_line", "nz_gst_no", "nz_gst_3_23", "nz_buyer_over_1000"]

[[fields]]
name = "document_title"
label = "单据标题"
names = { en = "Document Title" }
type = "string"
description = "单据最上面的标题，照抄"

[[fields]]
name = "invoice_no"
label = "发票号码"
names = { en = "Invoice No." }
type = "string"
unique = true
description = "照抄，不要改格式"

[[fields]]
name = "issue_date"
label = "开具日期"
names = { en = "Date of Issue" }
type = "date"
required = true

[[fields]]
name = "seller_name"
label = "卖方名称"
names = { en = "Seller" }
type = "string"
required = true

[[fields]]
name = "seller_tax_id"
label = "GST 号"
names = { en = "GST Number" }
type = "string"
aliases = ["GST No", "GST Reg"]

[[fields]]
name = "buyer_name"
label = "买方名称"
names = { en = "Buyer" }
type = "string"

[[fields]]
name = "buyer_identifier"
label = "买方识别信息"
names = { en = "Recipient Identifier" }
type = "string"
description = "地址、电话、邮箱、NZBN、网址中的一项，照抄"

[[fields]]
name = "net_total"
label = "不含税合计"
names = { en = "Total excl. Tax" }
type = "number"

[[fields]]
name = "tax_total"
label = "税额合计"
names = { en = "Total Tax" }
type = "number"

[[fields]]
name = "gross_total"
label = "含税合计"
names = { en = "Total incl. Tax" }
type = "number"
required = true

[[tables]]
name = "items"
label = "明细"
names = { en = "Items" }
description = "每一行商品或服务一行；表头、小计、合计不算"

[[tables.columns]]
name = "description"
label = "品名"
names = { en = "Description" }
type = "string"

[[tables.columns]]
name = "quantity"
label = "数量"
names = { en = "Quantity" }
type = "number"

[[tables.columns]]
name = "unit_price"
label = "单价"
names = { en = "Unit Price" }
type = "number"

[[tables.columns]]
name = "amount"
label = "金额"
names = { en = "Amount" }
type = "number"
description = "这一行的金额（单据上怎么写就照抄：含税还是不含税看表头）"
