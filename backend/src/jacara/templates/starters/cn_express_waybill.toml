# 起步模板：国内快递、货运运单（面单）。
# 字段按 GB/T 28582《快递运单》和快递、零担货运运单的通用要素设计：运单号、寄件人和收件人信息、
# 内件品名、件数、重量、保价、各项费用、付款方式、签收；物流公司各家格式不同，字段取共有的部分。
# 寄件人、收件人的姓名、电话、地址标成敏感（默认不导出）。只写字段，不放任何真实运单的内容。

name = "cn_express_waybill"
version = 2
title = "快递 / 货运运单"
titles = { en = "Express / Freight Waybill (China)" }
domains = ["物流"]
countries = ["CN"]
description = "国内快递、快运、零担货运的运单（面单、托运单）：运单号、寄件人、收件人、内件品名、件数、计费重量、保价、运费和其他费用、付款方式、签收人。各项费用加起来和费用合计对不上会提醒。"
rules = ["waybill_fees"]

[[fields]]
name = "carrier"
label = "物流公司"
names = { en = "Carrier" }
type = "string"
required = true
description = "快递、物流公司的名称，常在左上角 Logo 旁"
aliases = ["承运人", "承运公司", "快递公司"]

[[fields]]
name = "waybill_no"
label = "运单号"
names = { en = "Waybill No." }
type = "string"
required = true
unique = true
description = "运单号、快递单号、托运单号，照抄（条码下面的数字）"
aliases = ["运单号码", "快递单号", "托运单号", "单号", "Waybill No", "Tracking No"]

[[fields]]
name = "ship_date"
label = "寄件日期"
names = { en = "Shipping Date" }
type = "date"
aliases = ["寄件日期", "托运日期", "揽收日期", "日期"]

[[fields]]
name = "service_type"
label = "服务类型"
names = { en = "Service Type" }
type = "string"
description = "产品或服务类型，照抄，如 标准快递、特快、次日达、整车、零担"
aliases = ["产品类型", "业务类型", "服务方式", "运输方式"]

[[fields]]
name = "sender_name"
label = "寄件人"
names = { en = "Sender" }
type = "string"
sensitive = true
aliases = ["寄件人姓名", "发货人", "托运人", "寄方"]

[[fields]]
name = "sender_phone"
label = "寄件人电话"
names = { en = "Sender Phone" }
type = "string"
sensitive = true
description = "照抄，打了星号的也照抄"
aliases = ["寄件人电话", "发货人电话", "寄方电话"]

[[fields]]
name = "sender_address"
label = "寄件地址"
names = { en = "Sender Address" }
type = "string"
sensitive = true
aliases = ["寄件人地址", "发货地址", "寄方地址", "始发地"]

[[fields]]
name = "receiver_name"
label = "收件人"
names = { en = "Recipient" }
type = "string"
sensitive = true
aliases = ["收件人姓名", "收货人", "收方"]

[[fields]]
name = "receiver_phone"
label = "收件人电话"
names = { en = "Recipient Phone" }
type = "string"
sensitive = true
aliases = ["收件人电话", "收货人电话", "收方电话"]

[[fields]]
name = "receiver_address"
label = "收件地址"
names = { en = "Recipient Address" }
type = "string"
sensitive = true
aliases = ["收件人地址", "收货地址", "收方地址", "目的地"]

[[fields]]
name = "item_description"
label = "内件品名"
names = { en = "Contents" }
type = "string"
description = "托寄物、货物名称，照抄"
aliases = ["托寄物", "物品名称", "货物名称", "内件", "品名"]

[[fields]]
name = "pieces"
label = "件数"
names = { en = "Pieces" }
type = "number"
aliases = ["件数", "数量", "包裹数"]

[[fields]]
name = "weight"
label = "计费重量"
names = { en = "Chargeable Weight" }
type = "number"
description = "计费重量（公斤），只要数字；只写实际重量的照抄实际重量"
aliases = ["计费重量", "重量", "实际重量", "kg"]

[[fields]]
name = "volume"
label = "体积"
names = { en = "Volume" }
type = "number"
description = "体积（立方米或立方厘米，照单据），快运常有"
aliases = ["体积", "方数"]

[[fields]]
name = "declared_value"
label = "保价金额"
names = { en = "Declared Value" }
type = "number"
description = "声明价值、保价金额，只要数字"
aliases = ["声明价值", "保价金额", "保价"]

[[fields]]
name = "freight"
label = "运费"
names = { en = "Freight" }
type = "number"
aliases = ["运费", "基本运费", "快递费"]

[[fields]]
name = "insurance_fee"
label = "保价费"
names = { en = "Insurance Fee" }
type = "number"
aliases = ["保价费", "保险费"]

[[fields]]
name = "packing_fee"
label = "包装费"
names = { en = "Packing Fee" }
type = "number"
aliases = ["包装费"]

[[fields]]
name = "other_fees"
label = "其他费用"
names = { en = "Other Fees" }
type = "number"
description = "送货上门、上楼、代收手续费等其他费用加起来"
aliases = ["其他费用", "增值服务费", "附加费"]

[[fields]]
name = "total"
label = "费用合计"
names = { en = "Total Charges" }
type = "number"
aliases = ["费用合计", "合计", "总费用", "应付金额", "总运费"]

[[fields]]
name = "payment_method"
label = "付款方式"
names = { en = "Payment Method" }
type = "string"
options = ["寄付", "到付", "月结", "第三方付", "现付"]
aliases = ["付款方式", "结算方式", "支付方式"]

[[fields]]
name = "collect_on_delivery"
label = "代收货款"
names = { en = "Cash on Delivery" }
type = "number"
aliases = ["代收货款", "代收款", "COD"]

[[fields]]
name = "signer"
label = "签收人"
names = { en = "Signed by" }
type = "string"
sensitive = true
description = "签收人签字，照抄；手写看不清的留空"
aliases = ["收件人签名", "签收人", "签收"]

[[fields]]
name = "sign_date"
label = "签收时间"
names = { en = "Signed at" }
type = "string"
description = "照抄（含时分）"
aliases = ["签收时间", "签收日期"]
