# 起步模板：India GST tax invoice。
# 依据：CGST Rules 2017 Rule 46（(a) supplier name/address/GSTIN；(b) 发票号 ≤16 字符、财年内唯一；(c) 日期；(d)(e) recipient；
#   (g) HSN；(h)–(m) 描述、数量、价值、应税价值、税率和税额（central / state / integrated / cess）；(n) place of supply；
#   (p) reverse charge；(q) 签名；(r) 电子发票的 IRN 二维码）。GSTIN 15 位带校验位。
# 场景：GST 登记的供应商开具；买方凭此在 GSTR-2B 里抵扣 ITC。
# 来源：CBIC Tax Information Portal「Rule 46. Tax invoice」。
# 只写字段和法规要求，不放任何真实单据的内容。

name = "in_gst_invoice"
version = 1
title = "印度 GST 税务发票"
titles = { en = "GST Tax Invoice (India)", hi = "कर बीजक" }
countries = ["IN"]
domains = ["发票"]
description = "印度的 GST tax invoice：供应商和收货方的名称地址 GSTIN、发票号、日期、HSN、描述、数量、应税价值、税率、CGST / SGST / IGST、place of supply、reverse charge、IRN。GSTIN 校验位不对、发票号超过 16 位、IGST 和 CGST/SGST 同时出现会提醒。"
descriptions = { en = "Indian GST tax invoices: names, addresses and GSTINs of the supplier and recipient, invoice number, date, HSN, description, quantity, taxable value, rate, CGST / SGST / IGST, place of supply, reverse charge, IRN. Invalid GSTIN check digits, invoice numbers longer than 16 characters, and IGST together with CGST/SGST are reported." }
rules = ["issue_date_exists", "issue_date_not_future", "net_tax_gross", "item_line", "in_seller_gstin", "in_buyer_gstin", "in_invoice_no", "in_tax_split"]

[basis]
# English version of the notes at the top of this file.
en = [
  "For: Indian GST tax invoices.",
  "Basis: CGST Rules 2017 rule 46 ((a) supplier name/address/GSTIN; (b) invoice number of at most 16 characters, unique within the financial year; (c) date; (d)(e) recipient; (g) HSN; (h)–(m) description, quantity, value, taxable value, rate and tax (central / state / integrated / cess); (n) place of supply; (p) reverse charge; (q) signature; (r) IRN QR code of e-invoices). 15-character GSTIN with a check digit.",
  "Use: issued by GST-registered suppliers; buyers claim ITC with it in GSTR-2B.",
  "Source: CBIC Tax Information Portal \"Rule 46. Tax invoice\".",
]

[[fields]]
name = "document_title"
label = "单据标题"
names = { en = "Document Title", hi = "कर बीजक" }
type = "string"
description = "单据最上面的标题，照抄"
descriptions = { en = "The title at the top of the document; copy it as written" }
aliases = ["कर बीजक"]

[[fields]]
name = "invoice_no"
label = "发票号码"
names = { en = "Invoice No.", hi = "बीजक संख्या" }
type = "string"
required = true
unique = true
description = "照抄，不要改格式"
descriptions = { en = "Copy it as written; do not change the format" }
aliases = ["बीजक संख्या"]

[[fields]]
name = "issue_date"
label = "开具日期"
names = { en = "Date of Issue", hi = "दिनांक" }
type = "date"
required = true
aliases = ["दिनांक"]

[[fields]]
name = "seller_name"
label = "卖方名称"
names = { en = "Seller", hi = "आपूर्तिकर्ता" }
type = "string"
required = true
aliases = ["आपूर्तिकर्ता"]

[[fields]]
name = "seller_address"
label = "卖方地址"
names = { en = "Seller Address", hi = "आपूर्तिकर्ता का पता" }
type = "string"
aliases = ["आपूर्तिकर्ता का पता"]

[[fields]]
name = "seller_tax_id"
label = "供应商 GSTIN"
names = { en = "Supplier GSTIN", hi = "आपूर्तिकर्ता जीएसटीआईएन" }
type = "string"
aliases = ["GSTIN", "GST No", "आपूर्तिकर्ता जीएसटीआईएन"]

[[fields]]
name = "buyer_name"
label = "买方名称"
names = { en = "Buyer", hi = "प्राप्तकर्ता" }
type = "string"
aliases = ["प्राप्तकर्ता"]

[[fields]]
name = "buyer_address"
label = "买方地址"
names = { en = "Buyer Address", hi = "प्राप्तकर्ता का पता" }
type = "string"
aliases = ["प्राप्तकर्ता का पता"]

[[fields]]
name = "buyer_tax_id"
label = "收货方 GSTIN"
names = { en = "Recipient GSTIN", hi = "प्राप्तकर्ता जीएसटीआईएन" }
type = "string"
aliases = ["प्राप्तकर्ता जीएसटीआईएन"]

[[fields]]
name = "place_of_supply"
label = "供应地"
names = { en = "Place of Supply", hi = "आपूर्ति का स्थान" }
type = "string"
description = "邦名和代码，照抄"
descriptions = { en = "State name and code; copy it as written" }
aliases = ["आपूर्ति का स्थान"]

[[fields]]
name = "reverse_charge"
label = "反向征税"
names = { en = "Reverse Charge", hi = "रिवर्स चार्ज" }
type = "string"
description = "照抄 Yes / No"
descriptions = { en = "Copy Yes / No as written" }
aliases = ["रिवर्स चार्ज"]

[[fields]]
name = "net_total"
label = "不含税合计"
names = { en = "Total excl. Tax", hi = "कर योग्य मूल्य" }
type = "number"
aliases = ["कर योग्य मूल्य"]

[[fields]]
name = "cgst"
label = "CGST"
names = { en = "CGST" }
type = "number"

[[fields]]
name = "sgst"
label = "SGST / UTGST"
names = { en = "SGST / UTGST" }
type = "number"

[[fields]]
name = "igst"
label = "IGST"
names = { en = "IGST" }
type = "number"

[[fields]]
name = "tax_total"
label = "税额合计"
names = { en = "Total Tax", hi = "कुल कर" }
type = "number"
aliases = ["कुल कर"]

[[fields]]
name = "gross_total"
label = "含税合计"
names = { en = "Total incl. Tax", hi = "कुल राशि" }
type = "number"
required = true
aliases = ["कुल राशि"]

[[fields]]
name = "irn"
label = "IRN"
names = { en = "IRN" }
type = "string"
unique = true
description = "电子发票的 64 位 IRN，照抄"
descriptions = { en = "The 64-character IRN of the e-invoice; copy it as written" }

[[tables]]
name = "items"
label = "明细"
