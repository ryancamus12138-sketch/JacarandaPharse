# 起步模板：Italia fattura（elettronica via SdI，以及打印的 copia di cortesia）/ fattura semplificata。
# 依据：DPR 633/1972 art. 21 c. 2：data、numero progressivo、dati e partita IVA del cedente e del cessionario（o codice fiscale）、
#   natura, qualità e quantità、data della cessione se diversa、corrispettivi、aliquota, ammontare dell'imposta e imponibile；
#   art. 21-bis fattura semplificata ≤ 400 €（DM 10/05/2019）。Aliquote IVA 22 / 10 / 5 / 4 %。Partita IVA 11 位带校验位。
# 场景：意大利企业之间（SdI 电子发票）和报销用的打印件。
# 来源：Brocardi.it Testo unico IVA art. 21；finanzaefisco「fatture semplificate 400 euro」。
# 只写字段和法规要求，不放任何真实单据的内容。

name = "it_fattura"
version = 1
title = "意大利发票（Fattura）"
titles = { en = "Invoice (Italy)", it = "Fattura" }
countries = ["IT"]
domains = ["发票"]
description = "意大利的 fattura：日期、编号、卖方和买方的名称地址 Partita IVA 或 Codice Fiscale、品名数量、交付日期、应税额、税率和税额。Partita IVA 校验位不对、税率不是 22/10/5/4%、fattura semplificata 超过 400 € 会提醒。"
rules = ["issue_date_exists", "issue_date_not_future", "net_tax_gross", "item_line", "it_seller_piva", "it_buyer_piva", "it_rates", "it_semplificata_400"]

[[fields]]
name = "document_title"
label = "单据标题"
names = { en = "Document Title", it = "Tipo documento" }
type = "string"
description = "单据最上面的标题，照抄"
aliases = ["Tipo documento"]

[[fields]]
name = "invoice_no"
label = "发票号码"
names = { en = "Invoice No.", it = "Numero fattura" }
type = "string"
required = true
unique = true
description = "照抄，不要改格式"
aliases = ["Numero fattura"]

[[fields]]
name = "issue_date"
label = "开具日期"
names = { en = "Date of Issue", it = "Data" }
type = "date"
required = true
aliases = ["Data"]

[[fields]]
name = "supply_date"
label = "交易日期"
names = { en = "Date of Supply", it = "Data cessione" }
type = "date"
description = "供货或提供服务的日期；和开具日期一样、或没写的留空"
aliases = ["Data cessione"]

[[fields]]
name = "seller_name"
label = "卖方名称"
names = { en = "Seller", it = "Cedente / prestatore" }
type = "string"
required = true
aliases = ["Cedente / prestatore"]

[[fields]]
name = "seller_address"
label = "卖方地址"
names = { en = "Seller Address", it = "Sede cedente" }
type = "string"
aliases = ["Sede cedente"]

[[fields]]
name = "seller_tax_id"
label = "卖方增值税号"
names = { en = "Seller VAT No.", it = "Partita IVA cedente" }
type = "string"
aliases = ["P.IVA", "Partita IVA", "Partita IVA cedente"]

[[fields]]
name = "buyer_name"
label = "买方名称"
names = { en = "Buyer", it = "Cessionario / committente" }
type = "string"
aliases = ["Cessionario / committente"]

[[fields]]
name = "buyer_address"
label = "买方地址"
names = { en = "Buyer Address", it = "Sede cessionario" }
type = "string"
aliases = ["Sede cessionario"]

[[fields]]
name = "buyer_tax_id"
label = "买方增值税号 / 税号"
names = { en = "Buyer VAT / Tax Code", it = "P.IVA / C.F. cessionario" }
type = "string"
aliases = ["Codice Fiscale", "C.F.", "P.IVA / C.F. cessionario"]

[[fields]]
name = "sdi_code"
label = "收件代码"
names = { en = "Recipient Code (SdI)", it = "Codice destinatario" }
type = "string"
description = "Codice destinatario 或 PEC，照抄"
aliases = ["Codice destinatario"]

[[fields]]
name = "net_total"
label = "不含税合计"
names = { en = "Total excl. Tax", it = "Imponibile" }
type = "number"
aliases = ["Imponibile"]

[[fields]]
name = "tax_total"
label = "税额合计"
names = { en = "Total Tax", it = "Imposta" }
type = "number"
aliases = ["Imposta"]

[[fields]]
name = "gross_total"
label = "含税合计"
names = { en = "Total incl. Tax", it = "Totale documento" }
type = "number"
required = true
aliases = ["Totale documento"]

[[tables]]
name = "items"
label = "明细"
names = { en = "Items", it = "Righe" }
description = "每一行商品或服务一行；表头、小计、合计不算"

[[tables.columns]]
name = "description"
label = "品名"
names = { en = "Description", it = "Descrizione" }
type = "string"
aliases = ["Descrizione"]

[[tables.columns]]
name = "quantity"
label = "数量"
names = { en = "Quantity", it = "Quantità" }
type = "number"
aliases = ["Quantità"]

[[tables.columns]]
name = "unit_price"
label = "单价"
names = { en = "Unit Price", it = "Prezzo unitario" }
type = "number"
aliases = ["Prezzo unitario"]

[[tables.columns]]
name = "amount"
label = "金额"
names = { en = "Amount", it = "Importo" }
type = "number"
description = "这一行的金额（单据上怎么写就照抄：含税还是不含税看表头）"
aliases = ["Importo"]

[[tables.columns]]
name = "tax_rate"
label = "税率"
names = { en = "Tax Rate", it = "Aliquota IVA" }
type = "string"
aliases = ["Aliquota IVA"]
