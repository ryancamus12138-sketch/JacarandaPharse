# 起步模板：购物小票。
# 通用模板：不带任何国家或地区的规定（v2 起去掉了澳洲 ATO 的规则和说法）。
# 要按某个地方的税务规定检查，复制一份再自己写规则。
# 规则和字段说明只写通用规定，不放任何真实单据的内容。

name = "receipt_shopping"
version = 4
title = "购物小票"
titles = { en = "Shopping Receipt", ar = "إيصال مشتريات", de = "Kassenbon", es = "Ticket de compra", fr = "Ticket de caisse", hi = "खरीदारी रसीद", id = "Struk belanja", it = "Scontrino", ja = "レシート（買物）", ko = "쇼핑 영수증", ms = "Resit beli-belah", nl = "Kassabon winkel", pl = "Paragon sklepowy", th = "ใบเสร็จร้านค้า", vi = "Biên lai mua sắm", "zh-Hant" = "購物收據" }
domains = ["收据", "购物"]
description = "超市、商店的小票：逐项商品、折扣、找整，不分国家和地区。"
rules = ["total_positive", "date_exists", "date_not_future", "receipt_balance", "items_sum", "item_line", "cash_covers_total", "change"]

[[fields]]
name = "merchant"
label = "商家"
names = { en = "Merchant", ar = "التاجر", de = "Händler", es = "Comercio", fr = "Commerçant", hi = "व्यापारी", id = "Toko", it = "Esercente", ja = "店名", ko = "상호", ms = "Peniaga", nl = "Winkel", pl = "Sprzedawca", th = "ร้านค้า", vi = "Cửa hàng", "zh-Hant" = "商家" }
type = "string"
required = true
description = "开收据的商家名称，一般在最上面"
aliases = ["Store", "Shop"]

[[fields]]
name = "merchant_tax_id"
label = "商家税号"
names = { en = "Merchant Tax ID", ar = "الرقم الضريبي للتاجر", de = "Steuernummer Händler", es = "NIF del comercio", fr = "N° fiscal du commerçant", hi = "व्यापारी कर संख्या", id = "NPWP toko", it = "Partita IVA esercente", ja = "店舗登録番号", ko = "가맹점 사업자번호", ms = "No. cukai peniaga", nl = "Btw-nummer winkel", pl = "NIP sprzedawcy", th = "เลขประจำตัวผู้เสียภาษีร้านค้า", vi = "Mã số thuế cửa hàng", "zh-Hant" = "商家統一編號" }
type = "string"
aliases = ["Co. Reg No", "Company No", "GST Reg No", "SST No", "TIN", "统一社会信用代码"]
description = "商家的税务登记号或公司注册号，叫法各地不同（税号、统一社会信用代码、ABN、VAT No.、GST No. 等），原样照抄；没有就留空"

[[fields]]
name = "document_title"
label = "单据标题"
names = { en = "Document Title", ar = "عنوان المستند", de = "Belegart", es = "Tipo de documento", fr = "Titre du document", hi = "दस्तावेज़ का शीर्षक", id = "Jenis dokumen", it = "Tipo documento", ja = "書類名", ko = "문서명", ms = "Jenis dokumen", nl = "Documentsoort", pl = "Rodzaj dokumentu", th = "ชื่อเอกสาร", vi = "Tên chứng từ", "zh-Hant" = "單據標題" }
type = "string"
description = "收据上写的标题，如 收据、Receipt、Tax Invoice，原样照抄"

[[fields]]
name = "document_no"
label = "单号"
names = { en = "Receipt No.", ar = "رقم الإيصال", de = "Belegnummer", es = "N.º de ticket", fr = "N° de ticket", hi = "रसीद संख्या", id = "Nomor struk", it = "N. documento", ja = "レシート番号", ko = "영수증 번호", ms = "No. resit", nl = "Bonnummer", pl = "Numer paragonu", th = "เลขที่ใบเสร็จ", vi = "Số biên lai", "zh-Hant" = "收據號碼" }
type = "string"
description = "收据号、发票号或交易号"
aliases = ["Receipt No", "Invoice No", "Trans #", "Document No", "Doc No", "Bill No", "Receipt #", "Ref No", "单据号", "小票号"]

[[fields]]
name = "date"
