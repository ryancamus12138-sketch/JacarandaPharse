aliases = ["Date"]

[[fields]]
name = "time"
label = "时间"
names = { en = "Time", ar = "الوقت", de = "Uhrzeit", es = "Hora", fr = "Heure", hi = "समय", id = "Waktu", it = "Ora", ja = "時刻", ko = "시각", ms = "Masa", nl = "Tijd", pl = "Godzina", th = "เวลา", vi = "Giờ", "zh-Hant" = "時間" }
