required = true
description = "开发票的公司名称"
descriptions = { en = "The name of the company issuing the invoice" }
aliases = ["From", "Supplier", "Seller"]

[[fields]]
name = "seller_tax_id"
label = "卖方税号"
names = { en = "Seller Tax ID", ar = "الرقم الضريبي للبائع", de = "USt-IdNr. Verkäufer", es = "NIF del vendedor", fr = "N° TVA du vendeur", hi = "विक्रेता जीएसटीआईएन", id = "NPWP penjual", it = "Partita IVA cedente", ja = "売手登録番号", ko = "판매자 사업자등록번호", ms = "TIN penjual", nl = "Btw-id leverancier", pl = "NIP sprzedawcy", th = "เลขประจำตัวผู้เสียภาษีผู้ขาย", vi = "Mã số thuế người bán", "zh-Hant" = "賣方統一編號" }
type = "string"
