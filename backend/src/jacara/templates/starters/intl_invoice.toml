# 起步模板：通用发票。
# 字段来源：EN 16931（欧洲电子发票标准，Peppol BIS Billing 3.0 也用它）里不分国家都有的项目和金额关系。
# 不带任何国家或地区的税务规定；澳洲税务发票见 au_tax_invoice.toml。
# 规则和字段说明只写通用规定，不放任何真实单据的内容。

name = "intl_invoice"
version = 4
title = "通用发票"
titles = { en = "Invoice", ar = "فاتورة", de = "Rechnung", es = "Factura", fr = "Facture", hi = "बीजक", id = "Faktur", it = "Fattura", ja = "請求書", ko = "인보이스", ms = "Invois", nl = "Factuur", pl = "Faktura", th = "ใบแจ้งหนี้", vi = "Hóa đơn", "zh-Hant" = "發票" }
domains = ["发票"]
description = "任何国家的商业发票（Invoice）：卖方、买方、明细、不含税合计 + 税额 = 含税合计。字段和金额关系参考 EN 16931，不带地区规定。"
descriptions = { en = "Commercial invoices from any country: seller, buyer, line items, net total + tax = gross total. Fields and amount relations follow EN 16931, without regional rules." }
rules = ["issue_date_exists", "issue_date_not_future", "lines_net", "net_tax_gross", "due_not_above_gross", "item_line"]

[basis]
# English version of the notes at the top of this file.
en = [
  "For: generic invoices.",
  "Field source: the items and amount relations common to all countries in EN 16931 (the European e-invoicing standard, also used by Peppol BIS Billing 3.0).",
  "No tax rules of any country or region; for Australian tax invoices see au_tax_invoice.toml.",
]

[[fields]]
name = "document_title"
label = "单据标题"
names = { en = "Document Title", ar = "عنوان المستند", de = "Belegart", es = "Tipo de documento", fr = "Titre du document", hi = "दस्तावेज़ का शीर्षक", id = "Jenis dokumen", it = "Tipo documento", ja = "書類名", ko = "문서명", ms = "Jenis dokumen", nl = "Documentsoort", pl = "Rodzaj dokumentu", th = "ชื่อเอกสาร", vi = "Tên chứng từ", "zh-Hant" = "單據標題" }
type = "string"
description = "单据上写的标题，如 Invoice、Tax Invoice，原样照抄"
descriptions = { en = "The title written on the document, such as Invoice or Tax Invoice; copy it as written" }
aliases = ["Invoice", "Tax Invoice", "发票"]

[[fields]]
name = "invoice_no"
label = "发票号"
names = { en = "Invoice No.", ar = "رقم الفاتورة", de = "Rechnungsnummer", es = "Número de factura", fr = "Numéro de facture", hi = "बीजक संख्या", id = "Nomor faktur", it = "Numero fattura", ja = "請求書番号", ko = "인보이스 번호", ms = "No. invois", nl = "Factuurnummer", pl = "Numer faktury", th = "เลขที่ใบแจ้งหนี้", vi = "Số hóa đơn", "zh-Hant" = "發票號碼" }
unique = true
type = "string"
required = true
aliases = ["Invoice No.", "Invoice #", "Invoice Number"]

[[fields]]
name = "issue_date"
label = "开票日期"
names = { en = "Invoice Date", ar = "تاريخ الفاتورة", de = "Rechnungsdatum", es = "Fecha de factura", fr = "Date de facture", hi = "बीजक दिनांक", id = "Tanggal faktur", it = "Data fattura", ja = "請求日", ko = "발행일", ms = "Tarikh invois", nl = "Factuurdatum", pl = "Data wystawienia", th = "วันที่ออก", vi = "Ngày hóa đơn", "zh-Hant" = "開立日期" }
type = "date"
required = true
aliases = ["Invoice Date", "Date", "Date of issue"]

[[fields]]
name = "due_date"
label = "付款截止日"
names = { en = "Due Date", ar = "تاريخ الاستحقاق", de = "Fälligkeitsdatum", es = "Fecha de vencimiento", fr = "Date d'échéance", hi = "भुगतान की अंतिम तिथि", id = "Jatuh tempo", it = "Scadenza", ja = "支払期日", ko = "지급기한", ms = "Tarikh akhir bayaran", nl = "Vervaldatum", pl = "Termin płatności", th = "วันครบกำหนดชำระ", vi = "Hạn thanh toán", "zh-Hant" = "付款期限" }
type = "date"
aliases = ["Due Date", "Payment Due"]

[[fields]]
name = "currency"
label = "币种"
names = { en = "Currency", ar = "العملة", de = "Währung", es = "Moneda", fr = "Devise", hi = "मुद्रा", id = "Mata uang", it = "Valuta", ja = "通貨", ko = "통화", ms = "Mata wang", nl = "Valuta", pl = "Waluta", th = "สกุลเงิน", vi = "Loại tiền", "zh-Hant" = "幣別" }
type = "string"
description = "三个字母的币种代码，如 AUD、USD、EUR；单据上只有符号时按符号和国家判断"
descriptions = { en = "The three-letter currency code, such as AUD, USD, EUR; when the document shows only a symbol, infer it from the symbol and country" }
aliases = ["Currency"]

[[fields]]
name = "seller_name"
label = "卖方名称"
names = { en = "Seller Name", ar = "البائع", de = "Verkäufer", es = "Vendedor", fr = "Vendeur", hi = "विक्रेता", id = "Penjual", it = "Cedente", ja = "売手名", ko = "판매자", ms = "Penjual", nl = "Leverancier", pl = "Sprzedawca", th = "ผู้ขาย", vi = "Người bán", "zh-Hant" = "賣方名稱" }
