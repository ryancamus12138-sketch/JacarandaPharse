# 起步模板：检验报告（化验单）。
# 字段来源：医疗机构临床实验室管理办法（2006）规定的临床检验报告内容（实验室名称、患者姓名、性别、
# 年龄、病历号、检验项目、结果和单位、参考范围、异常提示、操作者、审核者、标本接收时间、报告时间），
# ISO 15189:2022 7.4.1.6（标本类型、采集时间）；
# 每一项检验结果的五个字段（项目、结果、单位、参考范围、异常提示）和 MedRepBench 论文的结构一致。
# 只写字段和通用规定，不放任何真实报告的内容。

name = "lab_report"
version = 2
title = "检验报告（化验单）"
titles = { en = "Laboratory Report", ar = "تقرير المختبر", de = "Laborbefund", es = "Informe de laboratorio", fr = "Compte rendu d'analyses", hi = "प्रयोगशाला रिपोर्ट", id = "Hasil laboratorium", it = "Referto di laboratorio", ja = "臨床検査報告書", ko = "임상검사 결과보고서", ms = "Laporan makmal", nl = "Laboratoriumuitslag", pl = "Wynik badania laboratoryjnego", th = "รายงานผลการตรวจทางห้องปฏิบัติการ", vi = "Phiếu kết quả xét nghiệm", "zh-Hant" = "檢驗報告" }
domains = ["医疗", "检验报告"]
description = "医院、体检中心、第三方实验室出具的检验报告：血常规、生化、尿常规、免疫等。患者信息、标本、送检和报告时间，以及每一项检验的结果、单位、参考范围、高低提示；检查结果超出参考范围却没标高低的会提醒。"
rules = ["lab_flag"]

[[fields]]
name = "institution"
label = "医疗机构"
names = { en = "Institution", ar = "المنشأة", de = "Einrichtung", es = "Centro", fr = "Établissement", hi = "संस्थान", id = "Institusi", it = "Struttura", ja = "医療機関", ko = "의료기관", ms = "Institusi", nl = "Instelling", pl = "Placówka", th = "สถานพยาบาล", vi = "Cơ sở y tế", "zh-Hant" = "醫療機構" }
type = "string"
description = "出报告的医院、体检中心或检验所名称，一般在最上面"
aliases = ["医院", "Hospital", "Laboratory", "Lab"]

[[fields]]
name = "report_title"
label = "报告名称"
names = { en = "Report Title", ar = "عنوان التقرير", de = "Berichtstitel", es = "Título del informe", fr = "Titre du compte rendu", hi = "रिपोर्ट का शीर्षक", id = "Judul laporan", it = "Titolo del referto", ja = "報告書名", ko = "보고서명", ms = "Tajuk laporan", nl = "Titel uitslag", pl = "Tytuł wyniku", th = "ชื่อรายงาน", vi = "Tên phiếu", "zh-Hant" = "報告名稱" }
type = "string"
description = "报告单的标题或检验组合，例如 血常规、肝功能、尿常规检验报告单，照抄"
aliases = ["检验项目", "检验目的", "组合项目", "Test", "Panel"]

[[fields]]
name = "patient_name"
label = "姓名"
names = { en = "Patient Name", ar = "اسم المريض", de = "Patientenname", es = "Nombre del paciente", fr = "Nom du patient", hi = "रोगी का नाम", id = "Nama pasien", it = "Nome del paziente", ja = "患者氏名", ko = "환자명", ms = "Nama pesakit", nl = "Naam patiënt", pl = "Imię i nazwisko pacjenta", th = "ชื่อผู้ป่วย", vi = "Họ tên người bệnh", "zh-Hant" = "姓名" }
type = "string"
required = true
sensitive = true
aliases = ["患者姓名", "病人姓名", "Patient", "Name"]

[[fields]]
name = "gender"
label = "性别"
names = { en = "Sex", ar = "الجنس", de = "Geschlecht", es = "Sexo", fr = "Sexe", hi = "लिंग", id = "Jenis kelamin", it = "Sesso", ja = "性別", ko = "성별", ms = "Jantina", nl = "Geslacht", pl = "Płeć", th = "เพศ", vi = "Giới tính", "zh-Hant" = "性別" }
type = "string"
options = ["男", "女", "Male", "Female", "M", "F"]
aliases = ["Sex", "Gender"]

[[fields]]
name = "age"
label = "年龄"
names = { en = "Age", ar = "العمر", de = "Alter", es = "Edad", fr = "Âge", hi = "आयु", id = "Usia", it = "Età", ja = "年齢", ko = "나이", ms = "Umur", nl = "Leeftijd", pl = "Wiek", th = "อายุ", vi = "Tuổi", "zh-Hant" = "年齡" }
type = "string"
description = "照抄，带单位（35岁、3月、10天）"
aliases = ["Age"]

[[fields]]
name = "record_no"
label = "病历号"
names = { en = "Medical Record No.", ar = "رقم الملف الطبي", de = "Patientennummer", es = "N.º de historia clínica", fr = "N° de dossier", hi = "मेडिकल रिकॉर्ड संख्या", id = "Nomor rekam medis", it = "N. cartella clinica", ja = "カルテ番号", ko = "등록번호", ms = "No. rekod perubatan", nl = "Patiëntnummer", pl = "Numer historii choroby", th = "เลขที่เวชระเบียน", vi = "Số hồ sơ bệnh án", "zh-Hant" = "病歷號" }
type = "string"
sensitive = true
description = "门诊号、住院号、病历号、ID 号、体检号，照抄"
aliases = ["门诊号", "住院号", "病人ID", "ID号", "体检号", "MRN", "Patient ID"]

[[fields]]
name = "department"
label = "科别"
names = { en = "Department", ar = "القسم", de = "Station", es = "Servicio", fr = "Service", hi = "विभाग", id = "Poli / ruang", it = "Reparto", ja = "診療科", ko = "진료과", ms = "Jabatan", nl = "Afdeling", pl = "Oddział", th = "แผนก", vi = "Khoa", "zh-Hant" = "科別" }
type = "string"
description = "申请检验的科室"
aliases = ["科室", "申请科室", "送检科室", "Department", "Ward"]

[[fields]]
name = "bed_no"
label = "床号"
names = { en = "Bed No.", ar = "رقم السرير", de = "Bettnummer", es = "N.º de cama", fr = "N° de lit", hi = "बेड संख्या", id = "Nomor tempat tidur", it = "N. letto", ja = "病床番号", ko = "병상번호", ms = "No. katil", nl = "Bednummer", pl = "Numer łóżka", th = "เตียง", vi = "Số giường", "zh-Hant" = "床號" }
type = "string"
aliases = ["Bed"]

[[fields]]
name = "doctor"
label = "送检医生"
names = { en = "Requesting Physician", ar = "الطبيب الطالب", de = "Anfordernder Arzt", es = "Médico solicitante", fr = "Médecin prescripteur", hi = "अनुरोधकर्ता चिकित्सक", id = "Dokter pengirim", it = "Medico richiedente", ja = "依頼医", ko = "의뢰의사", ms = "Doktor yang memohon", nl = "Aanvragend arts", pl = "Lekarz zlecający", th = "แพทย์ผู้ส่งตรวจ", vi = "Bác sĩ chỉ định", "zh-Hant" = "送檢醫師" }
type = "string"
aliases = ["申请医生", "开单医生", "临床医生", "Requesting Physician", "Doctor"]

[[fields]]
name = "diagnosis"
label = "临床诊断"
names = { en = "Clinical Diagnosis", ar = "التشخيص السريري", de = "Klinische Diagnose", es = "Diagnóstico clínico", fr = "Diagnostic clinique", hi = "नैदानिक निदान", id = "Diagnosis klinis", it = "Diagnosi clinica", ja = "臨床診断", ko = "임상진단", ms = "Diagnosis klinikal", nl = "Klinische diagnose", pl = "Rozpoznanie kliniczne", th = "การวินิจฉัย", vi = "Chẩn đoán", "zh-Hant" = "臨床診斷" }
type = "string"
sensitive = true
aliases = ["诊断", "Clinical Diagnosis"]

[[fields]]
name = "specimen"
label = "标本类型"
names = { en = "Specimen Type", ar = "نوع العينة", de = "Probenart", es = "Tipo de muestra", fr = "Type d'échantillon", hi = "नमूने का प्रकार", id = "Jenis spesimen", it = "Tipo di campione", ja = "検体種別", ko = "검체종류", ms = "Jenis spesimen", nl = "Soort monster", pl = "Rodzaj materiału", th = "ชนิดสิ่งส่งตรวจ", vi = "Loại mẫu", "zh-Hant" = "檢體類別" }
type = "string"
description = "血清、全血、尿液、粪便等"
aliases = ["样本类型", "标本", "样本", "Specimen", "Sample Type"]

[[fields]]
name = "specimen_no"
label = "标本号"
names = { en = "Specimen No.", ar = "رقم العينة", de = "Probennummer", es = "N.º de muestra", fr = "N° d'échantillon", hi = "नमूना संख्या", id = "Nomor spesimen", it = "N. campione", ja = "検体番号", ko = "검체번호", ms = "No. spesimen", nl = "Monsternummer", pl = "Numer próbki", th = "เลขที่สิ่งส่งตรวจ", vi = "Số mẫu", "zh-Hant" = "檢體編號" }
type = "string"
unique = true
description = "标本条码号、样本号、检验单号，照抄"
aliases = ["条码号", "样本号", "检验号", "Specimen No", "Barcode", "Accession No"]

[[fields]]
name = "collected_at"
label = "采集时间"
names = { en = "Collected", ar = "تاريخ السحب", de = "Entnahme", es = "Extracción", fr = "Prélèvement", hi = "संग्रह", id = "Diambil", it = "Prelievo", ja = "採取日時", ko = "채취일시", ms = "Diambil", nl = "Afname", pl = "Pobranie", th = "วันเวลาเก็บ", vi = "Thời gian lấy mẫu", "zh-Hant" = "採檢時間" }
type = "string"
description = "采样、采集时间，照抄（含时分）"
aliases = ["采样时间", "采集时间", "Collected", "Collection Time"]

[[fields]]
name = "received_at"
label = "接收时间"
names = { en = "Received", ar = "تاريخ الاستلام", de = "Eingang", es = "Recepción", fr = "Réception", hi = "प्राप्ति", id = "Diterima", it = "Accettazione", ja = "受付日時", ko = "접수일시", ms = "Diterima", nl = "Ontvangst", pl = "Przyjęcie", th = "วันเวลารับ", vi = "Thời gian nhận mẫu", "zh-Hant" = "接收時間" }
type = "string"
description = "实验室接收标本的时间，照抄（含时分）"
aliases = ["接收时间", "收样时间", "Received"]

[[fields]]
name = "reported_at"
label = "报告时间"
names = { en = "Reported", ar = "تاريخ التقرير", de = "Befunddatum", es = "Informe", fr = "Compte rendu", hi = "रिपोर्ट", id = "Dilaporkan", it = "Refertazione", ja = "報告日時", ko = "보고일시", ms = "Dilaporkan", nl = "Uitslagdatum", pl = "Wydanie wyniku", th = "วันเวลารายงาน", vi = "Thời gian trả kết quả", "zh-Hant" = "報告時間" }
type = "string"
description = "出报告、审核的时间，照抄（含时分）"
aliases = ["报告时间", "报告日期", "Reported", "Report Date"]

[[fields]]
name = "tester"
label = "检验者"
names = { en = "Tested by", ar = "أجراه", de = "Untersucht von", es = "Analizado por", fr = "Analysé par", hi = "जाँचकर्ता", id = "Diperiksa oleh", it = "Eseguito da", ja = "検査者", ko = "검사자", ms = "Diuji oleh", nl = "Uitgevoerd door", pl = "Wykonał", th = "ผู้ตรวจ", vi = "Người thực hiện", "zh-Hant" = "檢驗者" }
type = "string"
aliases = ["检验人", "检验医师", "操作者", "Tested by"]

[[fields]]
name = "reviewer"
label = "审核者"
names = { en = "Verified by", ar = "اعتمده", de = "Freigegeben von", es = "Validado por", fr = "Validé par", hi = "सत्यापनकर्ता", id = "Divalidasi oleh", it = "Validato da", ja = "確認者", ko = "확인자", ms = "Disahkan oleh", nl = "Gevalideerd door", pl = "Zatwierdził", th = "ผู้รับรองผล", vi = "Người duyệt", "zh-Hant" = "審核者" }
type = "string"
aliases = ["审核人", "审核医师", "Verified by", "Approved by"]

[[tables]]
name = "results"
label = "检验结果"
names = { en = "Results", ar = "النتائج", de = "Ergebnisse", es = "Resultados", fr = "Résultats", hi = "परिणाम", id = "Hasil", it = "Risultati", ja = "検査結果", ko = "검사결과", ms = "Keputusan", nl = "Uitslagen", pl = "Wyniki", th = "ผลการตรวจ", vi = "Kết quả", "zh-Hant" = "檢驗結果" }
required = true
description = "报告上每一项检验一行（例如白细胞、血红蛋白、谷丙转氨酶）。表头、分组标题、备注不算一行；两栏排版的报告左右两栏都要"

[[tables.columns]]
name = "code"
label = "代号"
names = { en = "Code", ar = "الرمز", de = "Kürzel", es = "Código", fr = "Code", hi = "कोड", id = "Kode", it = "Codice", ja = "コード", ko = "코드", ms = "Kod", nl = "Code", pl = "Kod", th = "รหัส", vi = "Mã", "zh-Hant" = "代號" }
type = "string"
description = "项目的英文缩写，如 WBC、HGB、ALT；没有就留空"
aliases = ["缩写", "代号", "Code"]

[[tables.columns]]
name = "name"
label = "项目"
names = { en = "Test", ar = "الفحص", de = "Untersuchung", es = "Prueba", fr = "Analyse", hi = "जाँच", id = "Pemeriksaan", it = "Esame", ja = "検査項目", ko = "검사항목", ms = "Ujian", nl = "Bepaling", pl = "Badanie", th = "รายการตรวจ", vi = "Xét nghiệm", "zh-Hant" = "檢驗項目" }
type = "string"
description = "检验项目的中文或英文名称，照抄"
aliases = ["项目名称", "检验项目", "Test", "Item"]

[[tables.columns]]
name = "result"
label = "结果"
names = { en = "Result", ar = "النتيجة", de = "Ergebnis", es = "Resultado", fr = "Résultat", hi = "परिणाम", id = "Hasil pemeriksaan", it = "Risultato", ja = "結果", ko = "결과", ms = "Keputusan ujian", nl = "Uitslag", pl = "Wynik", th = "ผล", vi = "Kết quả xét nghiệm", "zh-Hant" = "結果" }
type = "string"
description = "照抄结果：数字（12.3）、定性（阴性、阳性、+、-）、带符号（<0.1、>1000）都照原样；高低箭头不要写进结果"
aliases = ["结果", "测定值", "Result", "Value"]

[[tables.columns]]
name = "flag"
label = "提示"
names = { en = "Flag", ar = "مؤشر", de = "Kennzeichen", es = "Indicador", fr = "Indicateur", hi = "संकेत", id = "Tanda", it = "Segnalazione", ja = "判定", ko = "판정", ms = "Tanda", nl = "Markering", pl = "Oznaczenie", th = "สัญลักษณ์", vi = "Cờ", "zh-Hant" = "提示" }
type = "string"
description = "异常提示：↑、↓、H、L、高、低、阳性、* 等，照抄；正常没有就留空"
aliases = ["提示", "标志", "异常", "Flag"]

[[tables.columns]]
name = "unit"
label = "单位"
names = { en = "Unit", ar = "الوحدة", de = "Einheit", es = "Unidad", fr = "Unité", hi = "इकाई", id = "Satuan", it = "Unità", ja = "単位", ko = "단위", ms = "Unit", nl = "Eenheid", pl = "Jednostka", th = "หน่วย", vi = "Đơn vị", "zh-Hant" = "單位" }
type = "string"
description = "结果的单位，如 10^9/L、g/L、mmol/L、U/L，照抄"
aliases = ["单位", "Unit", "Units"]

[[tables.columns]]
name = "reference"
label = "参考范围"
names = { en = "Reference Range", ar = "المدى المرجعي", de = "Referenzbereich", es = "Intervalo de referencia", fr = "Valeurs de référence", hi = "संदर्भ सीमा", id = "Nilai rujukan", it = "Valori di riferimento", ja = "基準値", ko = "참고치", ms = "Julat rujukan", nl = "Referentiewaarden", pl = "Zakres referencyjny", th = "ค่าอ้างอิง", vi = "Khoảng tham chiếu", "zh-Hant" = "參考範圍" }
type = "string"
description = "参考范围或参考区间，照抄，如 3.5-9.5、<5.0、阴性"
aliases = ["参考值", "参考区间", "正常值", "Reference", "Reference Range", "Ref"]

[[tables.columns]]
name = "method"
label = "方法"
names = { en = "Method", ar = "الطريقة", de = "Methode", es = "Método", fr = "Méthode", hi = "विधि", id = "Metode", it = "Metodo", ja = "測定方法", ko = "검사방법", ms = "Kaedah", nl = "Methode", pl = "Metoda", th = "วิธีตรวจ", vi = "Phương pháp", "zh-Hant" = "方法" }
type = "string"
description = "检验方法，有才写"
aliases = ["检验方法", "Method"]
