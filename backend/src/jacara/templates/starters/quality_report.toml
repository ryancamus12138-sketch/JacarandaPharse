# 起步模板：检验检测报告（质检报告）。
# 字段按 ISO/IEC 17025:2017（GB/T 27025-2019）7.8.2.1 规定的报告内容设计：报告标题、实验室名称、
# 报告的唯一编号、委托方、所用方法（检验依据）、样品描述和状态、样品接收日期、检测日期、签发日期、
# 结果及单位、批准人；再加上产品质检报告上常见的规格型号、批号、生产单位、检验类别、
# 每一项的标准要求和单项判定、检验结论。只写字段和通用要求，不放任何真实报告的内容。

name = "quality_report"
version = 2
title = "检验检测报告（质检报告）"
titles = { en = "Test Report", ar = "تقرير الاختبار", de = "Prüfbericht", es = "Informe de ensayo", fr = "Rapport d'essai", hi = "परीक्षण रिपोर्ट", id = "Laporan hasil uji", it = "Rapporto di prova", ja = "試験報告書", ko = "시험성적서", ms = "Laporan ujian", nl = "Testrapport", pl = "Sprawozdanie z badań", th = "รายงานผลการทดสอบ", vi = "Phiếu kết quả thử nghiệm", "zh-Hant" = "檢驗報告（品質）" }
domains = ["质检", "检验报告"]
description = "产品质量检验报告、第三方检测报告、出厂检验报告（COA）：报告编号、检测机构、样品名称、规格型号、批号、生产和委托单位、检验依据、收样和签发日期、检验结论，以及每一项的标准要求、检验结果、单项判定。有一项不合格结论却写合格（或者反过来）、收样晚于签发会提醒。"
rules = ["qc_conclusion", "qc_dates"]

