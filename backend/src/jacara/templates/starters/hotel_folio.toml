# 起步模板：酒店账单。
# 字段来源：schema.org LodgingReservation（checkinTime、checkoutTime、lodgingUnitDescription）
# 规则和字段说明只写通用规定，不放任何真实单据的内容。

name = "hotel_folio"
version = 6
title = "酒店账单"
titles = { en = "Hotel Folio" }
domains = ["住宿"]
description = "酒店退房账单（Folio）：入住离店、房号、逐日消费。字段参考 schema.org LodgingReservation。"
rules = ["total_positive", "stay_order", "stay_nights", "issue_date_exists", "issue_date_not_future", "items_sum"]

[[fields]]
name = "hotel"
label = "酒店名称"
names = { en = "Hotel" }
type = "string"
required = true
description = "开账单的酒店名称，照抄单据上的完整写法（连分店名、所在地区一起）；下面一行的街道地址不算"
aliases = ["Hotel", "Hotel Name", "Hotel Details", "Property"]

[[fields]]
name = "guest"
label = "住客姓名"
names = { en = "Guest Name" }
type = "string"
required = true
aliases = ["Guest", "Guest Name"]

[[fields]]
name = "check_in"
label = "入住日期"
names = { en = "Arrival" }
type = "date"
required = true
aliases = ["Arrival", "Check-in", "Check In", "入住日期"]

[[fields]]
name = "check_out"
label = "离店日期"
names = { en = "Departure" }
type = "date"
required = true
aliases = ["Departure", "Check-out", "Check Out", "离店日期"]

[[fields]]
name = "nights"
label = "晚数"
names = { en = "Nights" }
type = "number"
description = "住了几晚：离店日期减入住日期，自动算，不从单据上找（Rooms 一栏是房间数，不是晚数）"
compute = "check_out - check_in"

[[fields]]
name = "room_no"
label = "房号"
names = { en = "Room No." }
type = "string"
description = "房间号码（例如 1208）。Rooms 一栏是房间数，不是房号"
aliases = ["Room No.", "Room Number"]

[[fields]]
name = "room_type"
label = "房型"
names = { en = "Room Type" }
type = "string"
aliases = ["Room Type"]

[[fields]]
name = "folio_no"
label = "账单号"
names = { en = "Folio No." }
unique = true
type = "string"
aliases = ["Folio No.", "Invoice No.", "Confirmation No.", "Booking ID", "Reservation No."]

[[fields]]
name = "issue_date"
label = "开具日期"
names = { en = "Date of Issue" }
type = "date"
aliases = ["Date", "Invoice Date"]

[[fields]]
name = "tax"
label = "税额"
names = { en = "Tax" }
type = "number"
aliases = ["GST", "VAT", "Tax"]

[[fields]]
name = "total"
label = "总额"
names = { en = "Total" }
type = "number"
required = true
description = "账单的总额（消费合计，不是付款后的余额）"
aliases = ["Total", "Total Charges"]

[[fields]]
name = "payment_method"
label = "付款方式"
names = { en = "Payment Method" }
type = "string"
aliases = ["Payment", "Payment Mode", "Settlement"]

[[tables]]
name = "items"
label = "消费明细"
names = { en = "Charges" }
description = "账单上逐笔的消费（房费、餐饮等），每笔一行。付款、押金退还这些行不算"

[[tables.columns]]
name = "date"
label = "日期"
names = { en = "Date" }
type = "date"

[[tables.columns]]
name = "description"
label = "内容"
names = { en = "Description" }
type = "string"
aliases = ["Description"]

[[tables.columns]]
name = "amount"
label = "金额"
names = { en = "Amount" }
type = "number"
aliases = ["Charges", "Amount"]
