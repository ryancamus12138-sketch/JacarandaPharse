[[fields]]
name = "supplier"
label = "送货单位"
names = { en = "Supplier", ar = "المورد", de = "Lieferant", es = "Proveedor", fr = "Fournisseur", hi = "आपूर्तिकर्ता", id = "Pemasok", it = "Fornitore", ja = "納入業者", ko = "공급자", ms = "Pembekal", nl = "Leverancier", pl = "Dostawca", th = "ผู้จำหน่าย", vi = "Nhà cung cấp", "zh-Hant" = "送貨單位" }
