# 起步模板：送货单（发货单、出库单）。
# 字段按国内企业送货单的通用要素设计：单号、日期、订单号、送货单位、收货单位、收货地址和联系人，
# 每一行的物料编码、品名、规格型号、单位、数量、单价、金额、备注，以及送货人、签收人。
# 送货单常是多联单（存根、客户、回单），签收联是对账、入库的依据。只写字段，不放任何真实单据的内容。

name = "delivery_note"
version = 2
title = "送货单"
titles = { en = "Delivery Note", ar = "إذن التسليم", de = "Lieferschein", es = "Albarán", fr = "Bon de livraison", hi = "डिलीवरी चालान", id = "Surat jalan", it = "Documento di trasporto (DDT)", ja = "納品書", ko = "거래명세서", ms = "Nota penghantaran", nl = "Pakbon", pl = "Dokument dostawy (WZ)", th = "ใบส่งของ", vi = "Phiếu giao hàng", "zh-Hant" = "送貨單" }
domains = ["物流", "采购"]
description = "供应商送货、仓库出库时的送货单（发货单、出库单）：单号、日期、订单号、送货和收货单位、每一行的品名、规格、数量、单价、金额，以及签收人。数量 × 单价和金额对不上、每行数量加起来和合计对不上会提醒。"
descriptions = { en = "Delivery notes issued when suppliers deliver or warehouses dispatch goods (delivery notes, dispatch notes, outbound notes): number, date, order number, sender and recipient, per row the description, specification, quantity, unit price, amount, and the person who signed for receipt. Quantity × unit price not matching the amount, and row quantities not adding up to the total, are reported." }
rules = ["item_line", "items_sum", "delivery_quantity"]

[basis]
# English version of the notes at the top of this file.
en = [
  "For: delivery notes (dispatch notes, outbound notes).",
  "Fields follow the common elements of delivery notes of Chinese companies: number, date, order number, sender, recipient, delivery address and contact, per row the material code, description, specification and model, unit, quantity, unit price, amount, remarks, plus the deliverer and the person signing for receipt.",
]

[[fields]]
name = "document_title"
label = "单据名称"
names = { en = "Document Title", ar = "عنوان المستند", de = "Belegart", es = "Tipo de documento", fr = "Titre du document", hi = "दस्तावेज़ का शीर्षक", id = "Jenis dokumen", it = "Tipo documento", ja = "書類名", ko = "문서명", ms = "Jenis dokumen", nl = "Documentsoort", pl = "Rodzaj dokumentu", th = "ชื่อเอกสาร", vi = "Tên chứng từ", "zh-Hant" = "單據標題" }
type = "string"
description = "单据上的标题，照抄，如 送货单、发货单、出库单、Delivery Note"
descriptions = { en = "The title on the document; copy it as written, such as 送货单, 发货单, 出库单, Delivery Note" }
aliases = ["Delivery Note", "Delivery Order", "D/O"]

[[fields]]
name = "document_no"
label = "送货单号"
names = { en = "Delivery Note No.", ar = "رقم إذن التسليم", de = "Lieferscheinnummer", es = "N.º de albarán", fr = "N° de bon de livraison", hi = "चालान संख्या", id = "Nomor surat jalan", it = "N. DDT", ja = "納品書番号", ko = "명세서 번호", ms = "No. nota penghantaran", nl = "Pakbonnummer", pl = "Numer WZ", th = "เลขที่ใบส่งของ", vi = "Số phiếu giao hàng", "zh-Hant" = "送貨單號" }
type = "string"
required = true
unique = true
description = "单据编号，照抄（常印在右上角，红色流水号）"
descriptions = { en = "The document number; copy it as written (often a red serial number at the top right)" }
aliases = ["单号", "No.", "NO", "编号", "送货单号", "发货单号", "出库单号", "Delivery No", "D/N No", "DO No"]

[[fields]]
name = "delivery_date"
label = "送货日期"
names = { en = "Delivery Date", ar = "تاريخ التسليم", de = "Lieferdatum", es = "Fecha de entrega", fr = "Date de livraison", hi = "डिलीवरी तिथि", id = "Tanggal pengiriman", it = "Data di consegna", ja = "納品日", ko = "납품일", ms = "Tarikh penghantaran", nl = "Leverdatum", pl = "Data dostawy", th = "วันที่ส่ง", vi = "Ngày giao hàng", "zh-Hant" = "送貨日期" }
