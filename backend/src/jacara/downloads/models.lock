# Models the desktop app offers to download (ADR 0068 section 6). Shipped with the program and never
# fetched at run time. Each file: model library name, size in bytes, SHA-256 of the whole file and
# its address at each source, pinned to the commit that last changed it, so an update of the
# repository cannot change what is downloaded. The size and SHA-256 are those of the files checked
# by hand (2026-11-14/15), not the metadata the sources report.
#
# Sources, in the order tried: Hugging Face (the publisher's repository), ModelScope (the same
# repository mirrored there), hf-mirror.com (community mirror of Hugging Face). Checked 2026-11-15:
# Hugging Face page (file SHA-256 and last commit), ModelScope API (Size, Sha256, CommitId).

