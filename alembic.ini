# Alembic (database migrations) configuration. The database URL is not set here; env.py reads it from .env.
#   New migration:   uv run alembic revision --autogenerate -m "message"
#   Upgrade:         uv run alembic upgrade head
#   Downgrade once:  uv run alembic downgrade -1
#   Current version: uv run alembic current

[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = .
# Split path lists with the operating system separator (current Alembic warns when this is missing)
path_separator = os
# Migration file names: date_revision_slug.py, sorted chronologically
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Format and fix generated migrations with ruff so they pass lint
[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
