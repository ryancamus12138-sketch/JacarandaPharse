# Alembic（数据库迁移）的设置。数据库地址不写在这里：env.py 从 .env 读取。
#   生成迁移：uv run alembic revision --autogenerate -m "说明"
#   升级到最新：uv run alembic upgrade head
#   退回一步：uv run alembic downgrade -1
#   看当前版本：uv run alembic current

[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = .
# 迁移文件名：日期_编号_说明.py，按时间排序一目了然
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# 生成迁移文件后，自动用 ruff 整理，保证能通过代码检查
[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
