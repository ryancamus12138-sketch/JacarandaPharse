# 开发用的基础设施：数据库、任务队列、对象存储。
#   启动：docker compose up -d
#   状态：docker compose ps
#   停止：docker compose down          （数据保留在 volumes 里）
#   清空：docker compose down -v       （连数据一起删掉，小心）
# 密码等配置从项目根目录的 .env 读取（复制 .env.example 后修改）。
# 端口只绑定 127.0.0.1：只有本机能连，同一网络里的其他电脑连不进来。

name: jacara

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jacara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 .env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jacara}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9.0-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    # 一个容器里同时跑 master、volume、filer 和 S3 接口；只把 S3 端口开放给本机。
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3", "-s3.port=8333"]
    environment:
      # 设置了这两个变量，S3 接口就只接受这对密钥（不设置则任何密钥都能访问）。
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?请先在 .env 里设置 S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?请先在 .env 里设置 S3_SECRET_KEY}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data

volumes:
  postgres-data:
  valkey-data:
  seaweedfs-data:
