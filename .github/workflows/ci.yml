name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: 安装依赖
        run: uv sync --locked
      - name: 代码检查
        run: uv run ruff check .
      - name: 格式检查
        run: uv run ruff format --check .
      - name: 类型检查
        run: uv run pyright
      - name: 自动化测试
        run: uv run pytest
