# Release workflow.
#
# Builds the release archive in this (private) repository and publishes it to the public
# distribution repository. The public repository contains only README.md and LICENSE; the
# archives are attached to its releases.
#
# Required configuration (Settings → Secrets and variables → Actions):
#   vars.PUBLIC_REPO              owner/name of the public repository
#   secrets.PUBLIC_RELEASE_TOKEN  fine-grained token with "Contents: Read and write" on that repository
#
# Tags containing "-" (for example v1.1.0-beta.1) are published as pre-releases.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.0.0"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PUBLIC_REPO: ${{ vars.PUBLIC_REPO }}
      GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check configuration
        run: |
          if [ -z "$PUBLIC_REPO" ] || [ -z "$GH_TOKEN" ]; then
            echo "error: set vars.PUBLIC_REPO and secrets.PUBLIC_RELEASE_TOKEN" >&2
            exit 1
          fi
          expected="v$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          if [ "${TAG%%-*}" != "${expected%%-*}" ]; then
            echo "error: tag $TAG does not match version $expected in pyproject.toml" >&2
            exit 1
          fi

      - name: Build release archive
        run: ./scripts/build_release.sh

      - name: Update README and LICENSE in the public repository
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${PUBLIC_REPO}.git" public
          cp packaging/README.md public/README.md
          cp LICENSE public/LICENSE
          cd public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md LICENSE
          if ! git diff --cached --quiet; then
            git commit -m "Update README and LICENSE for $TAG"
            git push
          fi

      - name: Publish release
        run: |
          if [[ "$TAG" == *-* ]]; then
            kind=(--prerelease --title "JacarandaParse $TAG (Pre-release)")
          else
            kind=(--latest --title "JacarandaParse $TAG")
          fi
          gh release create "$TAG" release/*.zip release/*.zip.sha256 \
            --repo "$PUBLIC_REPO" "${kind[@]}" --notes-file release/NOTES.md
