# 发布个人版（ADR 0064）：推送 v 开头的标签（例如 v1.0.0）时打包，上传到 GitHub Releases。
# 标签里带 - 的（例如 v1.1.0-beta.1）是测试版：标成预发布，不算"最新版"。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 打包
        run: ./scripts/build_release.sh
      - name: 发布到 GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            kind=(--prerelease --title "JacarandaParse $GITHUB_REF_NAME（测试版）")
          else
            kind=(--latest --title "JacarandaParse $GITHUB_REF_NAME（个人版）")
          fi
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.zip.sha256 \
            "${kind[@]}" --notes-file release/NOTES.md
