# JacarandaParse 项目配置
# 产品代码在 backend/src/jacara，包名叫 jacara。

[project]
name = "jacara"
version = "0.0.1"
description = "JacarandaParse：完全离线的文档结构化与人工审核工具"
requires-python = ">=3.12"
license = "Apache-2.0"

dependencies = [
    "httpx>=0.28.1",
    "onnxruntime>=1.31.1",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
    "rapidocr>=3.10.0",
]

[project.scripts]
jacara = "jacara.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.17",
    "pyright[nodejs]>=1.1.400",
    "pre-commit>=4.3",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/jacara"]

# ---------- ruff：代码风格 + 常见错误检查 ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 允许中文全角标点

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]  # 测试就是用 assert 写的

# ---------- pyright：类型检查 ----------
[tool.pyright]
include = ["backend/src", "backend/tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

# ---------- pytest：自动化测试 ----------
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
