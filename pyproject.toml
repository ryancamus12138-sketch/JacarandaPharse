# JacarandaParse 项目配置
# 产品代码在 backend/src/jacara，包名叫 jacara。

[project]
name = "jacara"
version = "1.0.0"
description = "JacarandaParse：完全离线的文档结构化与人工审核工具"
requires-python = ">=3.12"
license = "Apache-2.0"

dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.123",
    "celery[redis]>=5.7.0",
    "fastapi>=0.162.0",
    "fastapi-offline>=1.7.7",
    "httpx>=0.28.1",
    "onnxruntime>=1.31.1",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.33",
    "rapidocr>=3.10.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
jacara = "jacara.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.17",
    "pyright[nodejs]>=1.1.400",
    "pre-commit>=4.3",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/jacara"]

# ---------- ruff：代码风格 + 常见错误检查 ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 允许中文全角标点

[tool.ruff.lint.per-file-ignores]
# S101：测试就是用 assert 写的；S105、S106：测试里的假密码不是真密钥
"backend/tests/**" = ["S101", "S105", "S106"]

# ---------- pyright：类型检查 ----------
[tool.pyright]
include = ["backend/src", "backend/tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

# ---------- pytest：自动化测试 ----------
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
filterwarnings = [
    # Starlette 提示以后改用 httpx2；等 FastAPI 的 TestClient 跟进后删掉这一行
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
