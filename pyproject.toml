# JacarandaParse 项目配置
# 产品代码在 backend/src/jacara，包名叫 jacara。

[project]
name = "jacara"
version = "0.0.1"
description = "JacarandaParse：完全离线的文档结构化与人工审核工具"
requires-python = ">=3.12"
license = "Apache-2.0"
# 依赖会随模块逐步加入：第五课加 OCR，后面再加 FastAPI、数据库等。
dependencies = []

[project.scripts]
jacara = "jacara.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.17",
    "pyright[nodejs]>=1.1.400",
    "pre-commit>=4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/jacara"]

# ---------- ruff：代码风格 + 常见错误检查 ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 允许中文全角标点

# ---------- pyright：类型检查 ----------
[tool.pyright]
include = ["backend/src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
