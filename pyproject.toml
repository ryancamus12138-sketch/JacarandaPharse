# JacarandaParse project configuration.
# Application code lives in backend/src/jacara (package name: jacara).

[project]
name = "jacara"
version = "1.0.0"
description = "JacarandaParse: offline document extraction and human review"
requires-python = ">=3.12"
license = "Apache-2.0"

dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.123",
    "celery[redis]>=5.7.0",
    "fastapi>=0.162.0",
    "fastapi-offline>=1.7.7",
    "httpx>=0.28.1",
    "huey>=3.5.4",
    "numpy>=2",
    "onnxruntime>=1.31.1",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "rapid-layout>=1.2.1",
    "rapid-table>=3.0.2",
    "rapidocr>=3.10.0",
    "redis>=8.1.0",
    "scipy>=1.16",
    "shapely>=2.2.0",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
jacara = "jacara.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.17",
    "pyright[nodejs]>=1.1.400",
    "pre-commit>=4.3",
    "pytest>=9.2.0",
    "babel>=2.17",
]

[tool.uv]
# rapid-layout and rapid-table depend on opencv-python (GUI build) while rapidocr uses
# opencv-python-headless. Installed together they overwrite each other's cv2, so opencv-python is
# excluded and the headless build is used throughout.
override-dependencies = ["opencv-python ; sys_platform == 'never'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/jacara"]

# ---------- ruff: style and lint ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Allow full-width CJK punctuation in strings and comments

[tool.ruff.lint.per-file-ignores]
# S101: tests use assert; S105, S106: fake passwords in tests are not real secrets
"backend/tests/**" = ["S101", "S105", "S106"]

# ---------- pyright: type checking ----------
[tool.pyright]
include = ["backend/src", "backend/tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
filterwarnings = [
    # Starlette deprecation notice for httpx; remove once FastAPI's TestClient migrates
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
