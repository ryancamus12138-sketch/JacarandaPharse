# llama.cpp builds shipped with the desktop app, pinned to one release.
#
# release b12359 is llama.cpp v1.0.0: the v1.0.0 release page names it in nightly-tag.txt
# (https://github.com/ggml-org/llama.cpp/releases/tag/v1.0.0). Every file is downloaded from
#   https://github.com/ggml-org/llama.cpp/releases/download/<release>/<file>
# and checked against the size and the SHA-256 that GitHub publishes for the release asset; a
# difference stops the build (packaging/desktop/fetch_llama.py).
#
# variant: the name of the folder inside the package (llama/<variant>/llama-server). On Windows the
# app starts the Vulkan build when `llama-server --list-devices` of that build reports a GPU and the
# CPU build otherwise; the user can choose on the Models settings page.
# The Linux builds are only for checking the packaging on Linux; they are not shipped.

version = 1
release = "b12359"
upstream_version = "1.0.0"
license = "MIT"

[[builds]]
platform = "macos-arm64"
variant = "metal"
file = "llama-b12359-bin-macos-arm64.tar.gz"
size = 16907811
sha256 = "82b00abc740160e1b9980e6cc79c117345fa34af058c80e6c0a69aa8ddccde75"

[[builds]]
platform = "windows-x64"
variant = "cpu"
