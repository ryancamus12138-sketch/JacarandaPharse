# Runs before every git commit; the commit is rejected if any hook fails.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks          # Reject commits containing secrets

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]         # Apply automatic fixes
      - id: ruff-format       # Format code

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files   # Reject files over 1 MB (datasets, models)
        args: [--maxkb=1024]
      - id: end-of-file-fixer         # Ensure files end with a newline (W292)
      - id: trailing-whitespace       # Remove trailing whitespace
