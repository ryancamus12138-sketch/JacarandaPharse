# 每次 git commit 之前自动运行。任何一项不通过，这次提交就会被拦下。
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks          # 发现像密钥、密码的内容就拒绝提交

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]         # 能自动修的问题直接修好
      - id: ruff-format       # 自动整理格式

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files   # 超过 1MB 的文件不让提交，防止误传数据集和模型
        args: [--maxkb=1024]
      - id: end-of-file-fixer         # 自动补上文件末尾的换行（你刚遇到的 W292）
      - id: trailing-whitespace       # 自动删掉行尾多余的空格
